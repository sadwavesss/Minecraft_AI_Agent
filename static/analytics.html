<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant - Аналитика</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .analytics-content { margin-top: 20px; }
        .loading { display: none; color: #888; font-style: italic; }
        .stats-hud { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-number { font-size: 24px; font-weight: bold; color: #4CAF50; }
        .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        .generate-btn { padding: 12px 24px; font-size: 16px; background: #6200ea; color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .generate-btn:hover { background: #7c4dff; }
        .generate-btn:disabled { background: #333; cursor: not-allowed; }
        .markdown-body { padding: 20px; background: rgba(0,0,0,0.3); border-radius: 8px; line-height: 1.6; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: #bb86fc; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/admin">Логи</a>
            <a href="/admin/responses">Ответы LLM</a>
            <a href="/admin/analytics" class="active">Аналитика</a>
            <a href="/admin/wiki">Справочник</a>
            <a href="/admin/player-state">Player State</a>
            <a href="/admin/challenges">Challenges</a>
            <a href="/admin/settings">Настройки</a>
        </nav>
        
        <div class="analytics-container">
            <h2>Аналитика сессии</h2>
            <p>Генерация тактического обзора на основе текущих логов сервера (с момента запуска).</p>
            
            <button id="generateBtn" class="generate-btn" onclick="generateAnalytics()">Сгенерировать отчет (Может занять 5-15 сек)</button>
            <div id="loading" class="loading">Запрашиваем данные у Groq LLM...</div>
            
            <div id="results" class="analytics-content" style="display: none;">
                <div class="stats-hud" id="statsHud">
                    <!-- Заполняется JS -->
                </div>
                <div id="markdownResult" class="markdown-body"></div>
            </div>
        </div>
    </div>
    <script src="/frontend/js/analytics.js"></script>
</body>
</html>
