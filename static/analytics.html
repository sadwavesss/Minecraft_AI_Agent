<!DOCTYPE html>
<html>
<head>
    <title>AI Assistant - Аналитика</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .analytics-content { margin-top: 20px; }
        .loading { display: none; color: #888; font-style: italic; }
        .stats-hud { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); flex: 1; min-width: 150px; }
        .stat-number { font-size: 24px; font-weight: bold; color: #4CAF50; }
        .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        .generate-btn { padding: 12px 24px; font-size: 16px; background: #6200ea; color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .generate-btn:hover { background: #7c4dff; }
        .generate-btn:disabled { background: #333; cursor: not-allowed; }
        
        .markdown-body { 
            padding: 24px; 
            background: rgba(0,0,0,0.3); 
            border-radius: 8px; 
            line-height: 1.8;
            color: #c7d5e0;
        }
        
        .markdown-body h1 { 
            font-size: 28px; 
            font-weight: 700; 
            color: #1e90ff; 
            margin: 24px 0 16px 0; 
            border-bottom: 2px solid rgba(30,144,255,0.3); 
            padding-bottom: 8px; 
        }
        
        .markdown-body h2 { 
            font-size: 22px; 
            font-weight: 700; 
            color: #bb86fc; 
            margin: 20px 0 12px 0; 
            border-bottom: 1px solid rgba(187,134,252,0.2); 
            padding-bottom: 6px; 
        }
        
        .markdown-body h3 { 
            font-size: 18px; 
            font-weight: 600; 
            color: #76c043; 
            margin: 16px 0 8px 0; 
        }
        
        .markdown-body h4, .markdown-body h5, .markdown-body h6 { 
            font-weight: 600; 
            color: #8892a1; 
            margin: 12px 0 6px 0; 
        }
        
        .markdown-body p { 
            margin: 12px 0; 
        }
        
        .markdown-body ul, .markdown-body ol { 
            margin: 12px 0; 
            padding-left: 24px; 
        }
        
        .markdown-body li { 
            margin: 6px 0; 
        }
        
        .markdown-body code { 
            background: rgba(255,255,255,0.05); 
            padding: 2px 6px; 
            border-radius: 3px; 
            color: #f5a623; 
            font-family: 'Courier New', monospace; 
            font-size: 14px; 
        }
        
        .markdown-body pre { 
            background: rgba(0,0,0,0.4); 
            padding: 12px; 
            border-radius: 6px; 
            overflow-x: auto; 
            margin: 12px 0; 
            border-left: 3px solid #76c043; 
        }
        
        .markdown-body pre code { 
            background: none; 
            padding: 0; 
            color: #a0d468; 
        }
        
        .markdown-body blockquote { 
            border-left: 4px solid #1e90ff; 
            background: rgba(30,144,255,0.05); 
            padding: 12px 16px; 
            margin: 12px 0; 
            border-radius: 4px; 
            color: #8892a1; 
        }
        
        .markdown-body table { 
            width: 100%; 
            border-collapse: collapse; 
            margin: 12px 0; 
        }
        
        .markdown-body th { 
            background: rgba(30,144,255,0.1); 
            padding: 10px; 
            text-align: left; 
            border: 1px solid rgba(255,255,255,0.1); 
            color: #bb86fc; 
            font-weight: 700; 
        }
        
        .markdown-body td { 
            padding: 10px; 
            border: 1px solid rgba(255,255,255,0.05); 
        }
        
        .markdown-body strong { 
            color: #1e90ff; 
            font-weight: 700; 
        }
        
        .markdown-body em { 
            color: #f5a623; 
            font-style: italic; 
        }
        
        .markdown-body a { 
            color: #1e90ff; 
            text-decoration: none; 
            border-bottom: 1px solid rgba(30,144,255,0.3); 
        }
        
        .markdown-body a:hover { 
            border-bottom-color: #1e90ff; 
        }
        
        .markdown-body hr { 
            border: none; 
            border-top: 1px solid rgba(255,255,255,0.1); 
            margin: 20px 0; 
        }
        
        .markdown-body > *:first-child { 
            margin-top: 0; 
        }
        
        .markdown-body > *:last-child { 
            margin-bottom: 0; 
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/admin">Логи</a>
            <a href="/admin/responses">Ответы LLM</a>
            <a href="/admin/analytics" class="active">Аналитика</a>
            <a href="/admin/wiki">Справочник</a>
            <a href="/admin/player-state">Player State</a>
            <a href="/admin/challenges">Challenges</a>
            <a href="/admin/settings">Настройки</a>
        </nav>
        
        <div class="analytics-container">
            <h2>Аналитика сессии</h2>
            <p>Генерация тактического обзора на основе текущих логов сервера (с момента запуска).</p>
            
            <button id="generateBtn" class="generate-btn" onclick="generateAnalytics()">Сгенерировать отчет (Может занять 5-15 сек)</button>
            <div id="loading" class="loading">Запрашиваем данные у Groq LLM...</div>
            
            <div id="results" class="analytics-content" style="display: none;">
                <div class="stats-hud" id="statsHud">
                    <!-- Заполняется JS -->
                </div>
                <div id="markdownResult" class="markdown-body"></div>
            </div>
        </div>
    </div>
    <script src="/frontend/js/analytics.js"></script>
</body>
</html>
