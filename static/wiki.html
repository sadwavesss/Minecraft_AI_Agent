<!DOCTYPE html>
<html>
<head>
    <title>AI Справочник - Крафты</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .wiki-container { max-width: 600px; margin: 40px auto; text-align: center; }
        .search-box { width: 100%; padding: 15px; font-size: 18px; border-radius: 8px; border: 1px solid #bb86fc; background: rgba(0,0,0,0.5); color: white; margin-bottom: 20px; outline: none; }
        .search-box:focus { box-shadow: 0 0 10px rgba(187,134,252,0.5); }
        .loading { display: none; color: #888; font-style: italic; margin-bottom: 20px; }
        
        .crafting-table { 
            display: inline-grid; 
            grid-template-columns: repeat(3, 80px); 
            grid-gap: 5px; 
            background: #8b8b8b; 
            padding: 10px; 
            border-radius: 8px; 
            border: 4px solid #373737;
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.25), inset 4px 4px 0 rgba(255,255,255,0.4);
        }
        .crafting-slot { 
            width: 80px; 
            height: 80px; 
            background: #8b8b8b; 
            border-top: 4px solid #373737;
            border-left: 4px solid #373737;
            border-bottom: 4px solid white;
            border-right: 4px solid white;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 11px; 
            font-weight: bold;
            color: #333; 
            text-align: center; 
            word-wrap: break-word;
            padding: 2px;
            box-sizing: border-box;
        }
        .slot-filled { background: #a8a8a8; color: #000; }
        .recipe-info { margin-top: 20px; text-align: left; background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; }
        .recipe-name { color: #4CAF50; font-size: 24px; margin-top: 0; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="/admin">Логи</a>
            <a href="/admin/responses">Ответы LLM</a>
            <a href="/admin/wiki" class="active">Справочник</a>
            <a href="/admin/analytics">Аналитика</a>
            <a href="/admin/settings">Настройки</a>
        </nav>
        
        <div class="wiki-container">
            <h2>AI-Справочник крафтов</h2>
            <p>Введите предмет, который хотите скрафтить (например: "липкий поршень")</p>
            
            <input type="text" id="searchInput" class="search-box" placeholder="Найти рецепт...">
            <div id="loading" class="loading">ИИ вспоминает рецепт...</div>
            
            <div id="resultArea" style="display: none;">
                <div class="crafting-table" id="craftingGrid">
                    <!-- Сетка сгенерируется JS -->
                </div>
                
                <div class="recipe-info">
                    <h3 class="recipe-name" id="recipeName">Название</h3>
                    <p id="recipeDesc">Описание...</p>
                </div>
            </div>
        </div>
    </div>
    <script src="/frontend/js/wiki.js"></script>
</body>
</html>
